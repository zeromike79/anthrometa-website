<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="stopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f24"/>
      <stop offset="100%" stop-color="#0a1418"/>
    </linearGradient>
    <linearGradient id="stopLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A8FA0"/>
      <stop offset="100%" stop-color="#24CEDD"/>
    </linearGradient>
    <radialGradient id="stopGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#24CEDD" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#24CEDD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#stopBg)"/>
  <rect width="1440" height="900" fill="url(#stopGlow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>

  <!-- tier bands (안정·적정·도전) -->
  <g opacity="0.35">
    <rect x="0" y="620" width="1440" height="90" fill="#24CEDD" fill-opacity="0.05"/>
    <rect x="0" y="430" width="1440" height="90" fill="#24CEDD" fill-opacity="0.08"/>
    <rect x="0" y="240" width="1440" height="90" fill="#24CEDD" fill-opacity="0.12"/>
  </g>

  <!-- 성적 궤적 trend line: 중1 -> 고1 -> 고2 -> 고3 -->
  <path d="M120 700 C 320 660, 420 560, 560 520 C 720 475, 820 420, 980 340 C 1120 270, 1220 220, 1320 175"
        fill="none" stroke="url(#stopLine)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M120 700 C 320 660, 420 560, 560 520 C 720 475, 820 420, 980 340 C 1120 270, 1220 220, 1320 175 L1320 900 L120 900 Z"
        fill="url(#stopLine)" opacity="0.08"/>

  <!-- milestone points -->
  <g fill="#24CEDD">
    <circle cx="120" cy="700" r="7"/>
    <circle cx="560" cy="520" r="6"/>
    <circle cx="980" cy="340" r="6"/>
    <circle cx="1320" cy="175" r="8"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#c9eef1" text-anchor="middle">
    <text x="120" y="735">중1</text>
    <text x="560" y="555">고1</text>
    <text x="980" y="375">고2</text>
    <text x="1320" y="140">고3 · 진학</text>
  </g>

  <!-- HUD labels -->
  <g font-family="Montserrat, Arial, sans-serif" fill="#ffffff">
    <text x="60" y="90" font-size="40" font-weight="700" fill="#ffffff" opacity="0.95">STOP</text>
    <text x="60" y="122" font-size="16" fill="#8fd8de" opacity="0.85" letter-spacing="1">SMART TRAJECTORY FOR OPTIMAL PATH</text>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" text-anchor="end">
    <text x="1380" y="90" font-size="28" font-weight="700" fill="#24CEDD">KELS PANEL</text>
    <text x="1380" y="118" font-size="15" fill="#ffffff" opacity="0.6" letter-spacing="1">LONGITUDINAL EDUCATION DATA</text>
  </g>

  <!-- bottom status chips -->
  <g font-family="Montserrat, Arial, sans-serif" font-size="14" fill="#c9eef1">
    <rect x="60" y="800" width="190" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#24CEDD" stroke-opacity="0.35"/>
    <text x="155" y="823" text-anchor="middle">46 UNIVERSITIES DB</text>

    <rect x="266" y="800" width="180" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#24CEDD" stroke-opacity="0.35"/>
    <text x="356" y="823" text-anchor="middle">TIER MATCHING</text>

    <rect x="462" y="800" width="200" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#24CEDD" stroke-opacity="0.35"/>
    <text x="562" y="823" text-anchor="middle">AUTO PARENT REPORT</text>
  </g>
</svg>
