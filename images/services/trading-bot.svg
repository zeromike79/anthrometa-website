<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f24"/>
      <stop offset="100%" stop-color="#0a1418"/>
    </linearGradient>
    <linearGradient id="candleUp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24CEDD"/>
      <stop offset="100%" stop-color="#0A8FA0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A8FA0"/>
      <stop offset="100%" stop-color="#24CEDD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#24CEDD" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#24CEDD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>

  <!-- candlesticks (uptrend) -->
  <g>
    <line x1="140" y1="560" x2="140" y2="640" stroke="#3a5a60" stroke-width="3"/>
    <rect x="126" y="580" width="28" height="45" rx="2" fill="#3a5a60"/>

    <line x1="240" y1="520" x2="240" y2="610" stroke="url(#candleUp)" stroke-width="3"/>
    <rect x="226" y="540" width="28" height="50" rx="2" fill="url(#candleUp)"/>

    <line x1="340" y1="470" x2="340" y2="580" stroke="#3a5a60" stroke-width="3"/>
    <rect x="326" y="510" width="28" height="42" rx="2" fill="#3a5a60"/>

    <line x1="440" y1="430" x2="440" y2="540" stroke="url(#candleUp)" stroke-width="3"/>
    <rect x="426" y="450" width="28" height="60" rx="2" fill="url(#candleUp)"/>

    <line x1="540" y1="390" x2="540" y2="490" stroke="url(#candleUp)" stroke-width="3"/>
    <rect x="526" y="410" width="28" height="55" rx="2" fill="url(#candleUp)"/>

    <line x1="640" y1="410" x2="640" y2="500" stroke="#3a5a60" stroke-width="3"/>
    <rect x="626" y="430" width="28" height="40" rx="2" fill="#3a5a60"/>

    <line x1="740" y1="330" x2="740" y2="440" stroke="url(#candleUp)" stroke-width="3"/>
    <rect x="726" y="350" width="28" height="62" rx="2" fill="url(#candleUp)"/>

    <line x1="840" y1="300" x2="840" y2="390" stroke="url(#candleUp)" stroke-width="3"/>
    <rect x="826" y="315" width="28" height="50" rx="2" fill="url(#candleUp)"/>

    <line x1="940" y1="320" x2="940" y2="410" stroke="#3a5a60" stroke-width="3"/>
    <rect x="926" y="340" width="28" height="45" rx="2" fill="#3a5a60"/>

    <line x1="1040" y1="240" x2="1040" y2="340" stroke="url(#candleUp)" stroke-width="3"/>
    <rect x="1026" y="255" width="28" height="58" rx="2" fill="url(#candleUp)"/>

    <line x1="1140" y1="200" x2="1140" y2="290" stroke="url(#candleUp)" stroke-width="3"/>
    <rect x="1126" y="215" width="28" height="52" rx="2" fill="url(#candleUp)"/>

    <line x1="1240" y1="160" x2="1240" y2="260" stroke="url(#candleUp)" stroke-width="3"/>
    <rect x="1226" y="175" width="28" height="60" rx="2" fill="url(#candleUp)"/>
  </g>

  <!-- trend line overlay -->
  <path d="M100 650 L200 590 L300 560 L400 500 L500 460 L600 480 L700 400 L800 360 L900 380 L1000 300 L1100 250 L1200 210 L1300 170"
        fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- data point dots -->
  <g fill="#24CEDD">
    <circle cx="600" cy="480" r="5"/>
    <circle cx="900" cy="380" r="5"/>
    <circle cx="1300" cy="170" r="6"/>
  </g>

  <!-- HUD-style labels -->
  <g font-family="Montserrat, Arial, sans-serif" fill="#ffffff">
    <text x="60" y="90" font-size="34" font-weight="700" fill="#ffffff" opacity="0.92">BTC / MBL / SAND</text>
    <text x="60" y="122" font-size="17" fill="#8fd8de" opacity="0.85" letter-spacing="1">ALGORITHMIC TRADING ENGINE</text>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" text-anchor="end">
    <text x="1380" y="90" font-size="30" font-weight="700" fill="#24CEDD">4-LAYER</text>
    <text x="1380" y="118" font-size="15" fill="#ffffff" opacity="0.6" letter-spacing="1">SIGNAL SCORING</text>
  </g>

  <!-- bottom status chips -->
  <g font-family="Montserrat, Arial, sans-serif" font-size="14" fill="#c9eef1">
    <rect x="60" y="800" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#24CEDD" stroke-opacity="0.35"/>
    <text x="135" y="823" text-anchor="middle">STOP-LOSS -8%</text>

    <rect x="226" y="800" width="180" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#24CEDD" stroke-opacity="0.35"/>
    <text x="316" y="823" text-anchor="middle">RISK-CAPPED SIZING</text>

    <rect x="422" y="800" width="200" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#24CEDD" stroke-opacity="0.35"/>
    <text x="522" y="823" text-anchor="middle">BACKTESTED 2020–2024</text>
  </g>
</svg>
